[project]
name = "ct-lamp"
version = "0.1.0"
description = "CT-LAMP sparse-view CT reconstruction with DDNM+ multistep sampling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "monai>=1.3.0",
    "monai-generative>=0.2.3",
    "diffusers>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-image>=0.23.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "lpips>=0.1.4",
    "ipykernel>=6.29.0",
    "astra-toolbox>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
